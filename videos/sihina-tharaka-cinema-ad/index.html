      @font-face { font-family: "Tharaka Display"; src: url("assets/fonts/NotoSansDisplay-ExtraCondensedBold.ttf"); font-weight: 700; }
      @font-face { font-family: "Tharaka Sans"; src: url("assets/fonts/NotoSansDisplay-CondensedMedium.ttf"); font-weight: 500; }
      :root {
        --gold: #f7c74c; --amber: #ffb45c; --cream: #f2ede6; --ink: #06080a; --umber: #1a1006; --sepia: #a89070;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      .stage-bg { position: absolute; inset: 0;
        background: radial-gradient(ellipse 70% 60% at 50% 42%, #2a1a0a 0%, var(--umber) 38%, var(--ink) 78%); }
      #glow { position: absolute; left: 460px; top: -240px; width: 1000px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,180,92,0.20) 0%, rgba(255,180,92,0.06) 40%, rgba(255,180,92,0) 70%); }
      #dust { position: absolute; inset: 0; }
      .mote { position: absolute; border-radius: 50%;
        background: radial-gradient(circle, #ffe7a8 0%, rgba(247,199,76,0.7) 35%, rgba(247,199,76,0) 70%); }

      .panel { position: absolute; overflow: hidden; opacity: 0; background: #0d0904;

      .layer { position: absolute; inset: 0; overflow: hidden; }
      .layer video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* suneera.mp4 carries a "Venus" watermark near the bottom edge: over-scale and crop it away */
      .layer video.wm { left: -11%; top: -3%; width: 122%; height: 122%; }

      .bg-wrap { position: absolute; inset: -60px; opacity: 0; filter: blur(34px) brightness(0.42); }

tyle="object-position:50% 35%"></video></div><div class="layer" id="p5r-l3" data-layout-allow-overflow><video id="p5r-v3" class="clip" src="assets/anjali-sepia.mp4" data-start="37.00" data-duration="1.60" data-media-start="14.00" data-track-index="22" muted playsinline style="object-position:50% 35%"></video></div><div class="panel-edge"></div></div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const DUR = 50;

        // ---- golden dust: seeded, deterministic ----
        let seed = 20261031;
        const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
        const dust = document.getElementById("dust");
        for (let i = 0; i < 70; i++) {
          const d = document.createElement("div");
          d.className = "mote";
          const size = 4 + rnd() * 10;
          d.style.width = size + "px"; d.style.height = size + "px";
          d.style.left = (rnd() * 1920).toFixed(1) + "px";
          d.style.top = (rnd() * 1080).toFixed(1) + "px";
          dust.appendChild(d);
          const base = 0.15 + rnd() * 0.5;
          tl.fromTo(d, { y: 0, x: 0 }, { y: -(90 + rnd() * 220), x: (rnd() - 0.5) * 120, duration: DUR, ease: "none" }, 0);
          const cyc = 1.6 + rnd() * 2.4;
          tl.fromTo(d, { opacity: base * 0.25 }, { opacity: base, duration: cyc, ease: "sine.inOut", yoyo: true,
            repeat: Math.max(0, Math.floor(DUR / cyc) - 1) }, rnd() * 0.8);
        }
        tl.fromTo("#glow", { opacity: 0.55, scale: 0.95 }, { opacity: 1, scale: 1.08, duration: DUR, ease: "sine.inOut" }, 0);

        // ---- helpers ----
        const wordsIn = (sel, at, stagger = 0.14) =>
          tl.fromTo(sel + " .w", { opacity: 0, y: 34, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger }, at);
        const lineOut = (sel, at) =>
          tl.to(sel + " .w", { opacity: 0, y: -18, filter: "blur(8px)", duration: 0.6, ease: "power2.in", stagger: 0.04 }, at);
        const panelIn = (sel, at, dy = 50) =>
          tl.fromTo(sel, { opacity: 0, y: dy, scale: 1.03 }, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" }, at);
        const panelOut = (sel, at) => tl.to(sel, { opacity: 0, scale: 0.98, duration: 0.6, ease: "power2.in" }, at);
        const drift = (sel, at, dur, from = 1.0, to = 1.07) =>
          tl.fromTo(sel, { scale: from }, { scale: to, duration: dur, ease: "none" }, at);
        const xfade = (sel, at) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.inOut" }, at);

        // ---- 1. Opening: RnC Take One presents (0 – 4.2) ----
        tl.fromTo("#presents .kicker:first-child", { opacity: 0, scale: 1.08, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.6, ease: "power2.out" }, 0.5);
        tl.fromTo("#presents-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 1.1);
        tl.fromTo("#presents .small", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.7);
        tl.to("#presents", { opacity: 0, filter: "blur(8px)", duration: 0.8, ease: "power2.in" }, 3.4);

        // ---- 2. Two voices (4.0 – 12.4) ----
        panelIn("#p2l", 4.0); panelIn("#p2r", 4.25);
        drift("#p2l-l0", 4.0, 4.2); drift("#p2l-l1", 8.2, 4.2, 1.06, 1.0);
        drift("#p2r-l0", 4.0, 2.0); drift("#p2r-l1", 6.0, 2.9); drift("#p2r-l2", 8.9, 1.8); drift("#p2r-l3", 10.7, 1.7);
        xfade("#p2l-l1", 8.2);
        wordsIn("#l1", 5.2);
        lineOut("#l1", 11.5);
        panelOut("#p2l", 11.8); panelOut("#p2r", 11.8);

        // ---- 3. Three hours of music — triptych (12.4 – 21.2) ----
        panelIn("#p3a", 12.4, -50); panelIn("#p3b", 12.6, 50); panelIn("#p3c", 12.8, -50);
        ["#p3a-l0", "#p3a-l1", "#p3b-l0", "#p3b-l1", "#p3b-l2", "#p3c-l0", "#p3c-l1", "#p3c-l2", "#p3c-l3"].forEach((s, i) => {
          const starts = [12.4, 16.7, 12.4, 16.7, 18.7, 12.4, 14.3, 16.7, 18.6];
          drift(s, starts[i], 2.6, 1.0, 1.05);
          if (i > 0 && starts[i] > 12.4) xfade(s, starts[i]);
        });
        wordsIn("#l2", 13.5);
        lineOut("#l2", 20.3);
        panelOut("#p3a", 20.5); panelOut("#p3b", 20.6); panelOut("#p3c", 20.7);

        // ---- 4. The duo, in their own voices (21.2 – 30.4) — only clip with sound ----
        tl.fromTo("#bg-duo", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 21.2);
        tl.fromTo("#duo-frame", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 21.2);
        tl.fromTo("#side-l", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 1.0, ease: "power2.out" }, 22.0);
        tl.fromTo("#side-r", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 1.0, ease: "power2.out" }, 22.2);
        tl.to(["#side-l", "#side-r"], { opacity: 0, duration: 0.5 }, 29.6);
