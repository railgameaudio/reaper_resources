      .beam { position: absolute; top: -80px; width: 620px; height: 1400px; margin-left: -310px;
        transform-origin: 50% 0; filter: blur(30px);

      .lamp { position: absolute; top: -40px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%;

      #dust { position: absolute; inset: 0; }

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const DUR = 50;
        const XF = 1.0;
        let seed = 20261031;
        const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
        const loop = (cyc) => Math.max(0, Math.floor(DUR / cyc) - 1);

        // ---- starry sky ----
        const stars = document.getElementById("stars");
        for (let i = 0; i < 170; i++) {
          const s = document.createElement("div");
          const big = rnd() < 0.1;
          s.className = big ? "star big" : "star";
          const size = big ? 3 + rnd() * 2 : 1 + rnd() * 1.8;
          s.style.width = size + "px"; s.style.height = size + "px";
          s.style.left = (rnd() * 1920).toFixed(1) + "px";
          s.style.top = (rnd() * 1080).toFixed(1) + "px";
          stars.appendChild(s);
          const hi = big ? 0.95 : 0.35 + rnd() * 0.45;
          const cyc = 2.2 + rnd() * 3.5;
          tl.fromTo(s, { opacity: hi * 0.15 }, { opacity: hi, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: loop(cyc) }, rnd() * 1.5);
        }
        tl.fromTo("#stars", { opacity: 0 }, { opacity: 1, duration: 3.0, ease: "sine.inOut" }, 0);

        // ---- slow golden dust ----
        const dust = document.getElementById("dust");
        for (let i = 0; i < 40; i++) {
          const d = document.createElement("div");
          d.className = "mote";
          const size = 4 + rnd() * 9;
          d.style.width = size + "px"; d.style.height = size + "px";
          d.style.left = (rnd() * 1920).toFixed(1) + "px";
          d.style.top = (rnd() * 1080).toFixed(1) + "px";
          dust.appendChild(d);
          tl.fromTo(d, { y: 0, x: 0 }, { y: -(80 + rnd() * 180), x: (rnd() - 0.5) * 100, duration: DUR, ease: "none" }, 0);
          const cyc = 2.5 + rnd() * 3;
          const base = 0.15 + rnd() * 0.4;
          tl.fromTo(d, { opacity: base * 0.2 }, { opacity: base, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: loop(cyc) }, rnd() * 1.2);
        }

        // ---- spotlights: slow sweeps, intensity follows the scene ----
        [["#beam1", 14, -6, 10.5], ["#beam2", 6, -9, 13.0], ["#beam3", -6, 9, 12.0], ["#beam4", -14, 6, 11.0]].forEach(([s, a, b, cyc]) =>
          tl.fromTo(s, { rotation: a }, { rotation: b, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: loop(cyc) }, 0));
        tl.fromTo("#beams", { opacity: 0 }, { opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0);
        tl.fromTo("#pool", { opacity: 0 }, { opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0.4);
        const beams = (v, at, d = 2.0) => tl.to("#beams", { opacity: v, duration: d, ease: "sine.inOut" }, at);
        beams(0.55, 4.0); beams(0.3, 20.0, 1.5); beams(0.6, 28.67); beams(1.0, 34.67); beams(0.55, 39.33); beams(1.0, 43.33);
        tl.to("#pool", { opacity: 0.35, duration: 2.0, ease: "sine.inOut" }, 4.0);
        tl.to("#pool", { opacity: 1, duration: 2.0, ease: "sine.inOut" }, 43.33);

        // ---- helpers (slow, soft: 90 BPM, one beat = 0.667s) ----
        const wordsIn = (sel, at, stagger = 0.33, dur = 1.6) =>
          tl.fromTo(sel + " .w", { opacity: 0, y: 14, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "sine.out", stagger }, at);
        const lineOut = (sel, at, dur = 1.2) =>
          tl.to(sel + " .w", { opacity: 0, filter: "blur(8px)", duration: dur, ease: "sine.inOut", stagger: 0.06 }, at);
        const panelIn = (sel, at, dy = 24) =>
          tl.fromTo(sel, { opacity: 0, y: dy, scale: 1.02 }, { opacity: 1, y: 0, scale: 1, duration: 2.0, ease: "sine.out" }, at);
        const panelOut = (sel, at, d = 1.33) => tl.to(sel, { opacity: 0, scale: 0.99, duration: d, ease: "sine.inOut" }, at);

        // shot crossfades inside panels + slow push on every shot
        [
          ["#p2l-l0", 4.000, 5.750, 0],
          ["#p2l-l1", 8.750, 5.000, 1],
          ["#p2r-l0", 4.000, 2.333, 0],
          ["#p2r-l1", 5.333, 2.625, 1],
          ["#p2r-l2", 6.958, 2.333, 1],
          ["#p2r-l3", 8.292, 2.000, 1],
          ["#p2r-l4", 9.292, 3.571, 1],
          ["#p3a-l0", 12.000, 4.375, 0],
          ["#p3a-l1", 15.375, 5.875, 1],
          ["#p3b-l0", 12.330, 2.500, 0],
          ["#p3b-l1", 13.830, 3.571, 1],
          ["#p3b-l2", 16.401, 2.625, 1],
          ["#p3b-l3", 18.026, 2.333, 1],
          ["#p3b-l4", 19.360, 2.000, 1],
          ["#p3c-l0", 12.670, 5.132, 0],
          ["#p3c-l1", 16.802, 4.533, 1],
          ["#p5l-l0", 28.670, 5.000, 0],
          ["#p5l-l1", 32.670, 3.250, 1],
          ["#p5r-l0", 28.670, 2.500, 0],
          ["#p5r-l1", 30.170, 2.333, 1],
          ["#p5r-l2", 31.503, 2.000, 1],
          ["#p5r-l3", 32.503, 3.125, 1]
        ].forEach(([sel, st, d, xf]) => {
          if (xf) tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: XF, ease: "sine.inOut" }, st);
          tl.fromTo(sel, { scale: 1.0 }, { scale: 1.05, duration: d, ease: "none" }, st);
        });

        // 1. RnC Take One presents (0 – 4.67)
        tl.fromTo("#rnc-open", { opacity: 0, scale: 1.04, filter: "blur(14px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 2.0, ease: "sine.out" }, 0.67);
        tl.fromTo("#presents", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.33, ease: "sine.out" }, 2.0);
        tl.to(["#rnc-open", "#presents"], { opacity: 0, filter: "blur(8px)", duration: 1.33, ease: "sine.inOut" }, 3.67);

        // 2. two voices (4.0 – 12.67)
        panelIn("#p2l", 4.0); panelIn("#p2r", 4.33);
        wordsIn("#l1", 5.33);
        lineOut("#l1", 11.0);
        panelOut("#p2l", 11.33); panelOut("#p2r", 11.33);

        // 3. three hours of music (12.0 – 21.0)
        panelIn("#p3a", 12.0, -24); panelIn("#p3b", 12.33); panelIn("#p3c", 12.67, -24);
        wordsIn("#l2", 13.33);
        lineOut("#l2", 19.0);
        panelOut("#p3a", 19.33); panelOut("#p3b", 19.5); panelOut("#p3c", 19.67);

        // 4. the duo, in their own voices (20.33 – 29.36) — the only clip with sound
        tl.fromTo("#bg-duo", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "sine.inOut" }, 20.0);
        tl.fromTo("#duo-frame", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 1.33, ease: "sine.out" }, 20.33);
        tl.fromTo("#side-l", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 1.6, ease: "sine.out" }, 21.33);
        tl.fromTo("#side-r", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 1.6, ease: "sine.out" }, 21.67);
        tl.to(["#side-l", "#side-r"], { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 27.67);
        tl.to("#duo-frame", { opacity: 0, scale: 0.99, duration: 1.0, ease: "sine.inOut" }, 28.36);
        tl.to("#bg-duo", { opacity: 0, duration: 1.33, ease: "sine.inOut" }, 28.0);

        // 5. Suneera Sumanga & Anjalee Herath (28.67 – 35.33)
        panelIn("#p5l", 28.67); panelIn("#p5r", 29.0);
        wordsIn("#l3", 29.67, 0.3);
        lineOut("#l3", 33.67);
        panelOut("#p5l", 34.0); panelOut("#p5r", 34.0);

        // 6. official Sihina Tharaka logotype (34.67 – 40.67)
        tl.fromTo("#bg-stage1", { opacity: 0 }, { opacity: 0.7, duration: 2.0, ease: "sine.inOut" }, 34.67);
        tl.to("#bg-stage1", { opacity: 0, duration: 1.33, ease: "sine.inOut" }, 39.33);
        tl.fromTo("#logo", { opacity: 0, scale: 0.94, filter: "blur(18px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 2.0, ease: "sine.out" }, 35.33);
        tl.fromTo("#shine-bar", { x: -320 }, { x: 1200, duration: 2.0, ease: "sine.inOut" }, 37.0);
        tl.to("#logo", { opacity: 0, scale: 1.03, filter: "blur(10px)", duration: 1.33, ease: "sine.inOut" }, 39.33);

        // 7. RnC Take One — fresh arrangements (39.33 – 44.33)
        tl.fromTo("#team", { opacity: 0, y: 16, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 2.0, ease: "sine.out" }, 39.33);
        tl.fromTo("#team img", { scale: 1.0 }, { scale: 1.04, duration: 5.0, ease: "none" }, 39.33);
        wordsIn("#l5", 40.0, 0.33);
        lineOut("#l5", 43.0);
        tl.to("#team", { opacity: 0, filter: "blur(6px)", duration: 1.33, ease: "sine.inOut" }, 43.0);

        // 8. final beat: logo + punch line (43.33 – 50)
        tl.fromTo("#bg-stage2", { opacity: 0 }, { opacity: 0.5, duration: 2.0, ease: "sine.inOut" }, 43.33);
        tl.fromTo("#logo", { opacity: 0, y: -262, scale: 0.66, filter: "blur(14px)" },
          { opacity: 1, y: -262, scale: 0.62, filter: "blur(0px)", duration: 2.0, ease: "sine.out", immediateRender: false }, 43.67);
        tl.fromTo("#shine-bar", { x: -320 }, { x: 1200, duration: 2.0, ease: "sine.inOut", immediateRender: false }, 47.0);
        wordsIn("#p1", 44.33, 0.33, 1.6);
        wordsIn("#p2", 45.33, 0.5, 1.8);
        tl.fromTo("#endfoot", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.6, ease: "sine.out" }, 46.33);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "sine.in" }, 49.0);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
